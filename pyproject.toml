[project]
name = "stateful-agenticbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Pathak", email = "abhishek.pathak01111@gmail.com" }
]
requires-python = ">=3.11.9"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
stateful-agenticbot = "stateful_agenticbot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
